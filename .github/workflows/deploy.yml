name: Deploy SmileUp CMO

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: smileup-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to production server
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Regression checks
        env:
          MOCK_MODE: "true"
          DRY_RUN: "true"
          AD_LIBRARY_ENABLED: "false"
          AGENT_API_REASONING_ENABLED: "false"
          CMO_JURY_ENABLED: "false"
          FACEBOOK_PAGE_TOKENS_JSON: '{"ci_smoke_page":"ci_smoke_token"}'
          FACEBOOK_PAGE_NAMES_JSON: '{"ci_smoke_page":"CI Smoke Page"}'
        run: |
          set -euo pipefail
          node --check web/app.js
          python -m py_compile web_app.py main.py
          python -m tests.test_facebook_publisher_encoding
          python -m tests.smoke_workflow

      - name: Build release archive
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output=smileup-release.tar.gz HEAD

      - name: Check deploy configuration
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$SERVER_HOST" ] && [ -n "$SERVER_USER" ] && [ -n "$SERVER_PASSWORD" ]; then
            echo "DEPLOY_ENABLED=true" >> "$GITHUB_ENV"
            echo "Deploy configuration found."
          else
            echo "DEPLOY_ENABLED=false" >> "$GITHUB_ENV"
            echo "::warning::Deploy skipped because SERVER_HOST, SERVER_USER, or SERVER_PASSWORD secret is missing."
          fi

      - name: Upload and deploy over SSH
        if: env.DEPLOY_ENABLED == 'true'
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
        run: |
          set -euo pipefail

          sudo apt-get update -y
          sudo apt-get install -y sshpass

          SSH_OPTS="-p ${SERVER_PORT} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          SCP_OPTS="-P ${SERVER_PORT} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          sshpass -p "$SERVER_PASSWORD" scp $SCP_OPTS smileup-release.tar.gz "${SERVER_USER}@${SERVER_HOST}:/tmp/smileup-release.tar.gz"

          sshpass -p "$SERVER_PASSWORD" ssh $SSH_OPTS "${SERVER_USER}@${SERVER_HOST}" 'bash -s' <<'REMOTE_DEPLOY'
          set -euo pipefail

          APP_DIR="/opt/smileup-multi-agents"
          SERVICE_NAME="smileup-cmo"
          RELEASE="/tmp/smileup-release.tar.gz"
          STAGE="$(mktemp -d /tmp/smileup-release.XXXXXX)"
          PRESERVE="$(mktemp -d /tmp/smileup-preserve.XXXXXX)"
          BACKUP="${APP_DIR}.previous"
          ROLLED_BACK=false

          cleanup() {
            rm -rf "$STAGE" "$PRESERVE" "$RELEASE" /tmp/smileup-status.json
          }
          trap cleanup EXIT

          if [ ! -f "$RELEASE" ]; then
            echo "Release archive not found: $RELEASE"
            exit 1
          fi

          tar -xzf "$RELEASE" -C "$STAGE"
          test -f "$STAGE/web_app.py"
          test -f "$STAGE/requirements.txt"

          if [ -d "$APP_DIR" ]; then
            [ -f "$APP_DIR/.env" ] && cp -a "$APP_DIR/.env" "$PRESERVE/.env"
            [ -d "$APP_DIR/data" ] && cp -a "$APP_DIR/data" "$PRESERVE/data"
            [ -d "$APP_DIR/reports" ] && cp -a "$APP_DIR/reports" "$PRESERVE/reports"
            [ -d "$APP_DIR/web/generated" ] && mkdir -p "$PRESERVE/web" && cp -a "$APP_DIR/web/generated" "$PRESERVE/web/generated"
          fi

          cd "$STAGE"
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
          .venv/bin/python -m py_compile web_app.py main.py utils/config.py

          [ -f "$PRESERVE/.env" ] && cp -a "$PRESERVE/.env" "$STAGE/.env"
          if [ -f "$STAGE/.env" ]; then
            if grep -q '^OPENAI_MODEL=' "$STAGE/.env"; then
              sed -i 's/^OPENAI_MODEL=.*/OPENAI_MODEL=gpt-5.5/' "$STAGE/.env"
            else
              printf '\nOPENAI_MODEL=gpt-5.5\n' >> "$STAGE/.env"
            fi
            if grep -q '^OPENAI_IMAGE_MAX_CREATIVES=' "$STAGE/.env"; then
              sed -i 's/^OPENAI_IMAGE_MAX_CREATIVES=.*/OPENAI_IMAGE_MAX_CREATIVES=0/' "$STAGE/.env"
            else
              printf 'OPENAI_IMAGE_MAX_CREATIVES=0\n' >> "$STAGE/.env"
            fi
          fi
          mkdir -p "$STAGE/data" "$STAGE/reports" "$STAGE/web/generated/uploads" "$STAGE/web/generated/creatives"
          [ -d "$PRESERVE/data" ] && cp -a "$PRESERVE/data/." "$STAGE/data/"
          [ -d "$PRESERVE/reports" ] && cp -a "$PRESERVE/reports/." "$STAGE/reports/"
          [ -d "$PRESERVE/web/generated" ] && cp -a "$PRESERVE/web/generated/." "$STAGE/web/generated/"

          rollback() {
            if [ "$ROLLED_BACK" = "true" ]; then
              return
            fi
            ROLLED_BACK=true
            systemctl stop "$SERVICE_NAME" 2>/dev/null || true
            rm -rf "$APP_DIR"
            if [ -d "$BACKUP" ]; then
              mv "$BACKUP" "$APP_DIR"
              systemctl restart "$SERVICE_NAME" || true
            fi
          }

          systemctl stop "$SERVICE_NAME" 2>/dev/null || true
          rm -rf "$BACKUP"
          if [ -d "$APP_DIR" ]; then
            mv "$APP_DIR" "$BACKUP"
          fi
          mv "$STAGE" "$APP_DIR"
          systemctl daemon-reload
          if ! systemctl restart "$SERVICE_NAME"; then
            rollback
            exit 1
          fi
          if ! systemctl is-active --quiet "$SERVICE_NAME"; then
            rollback
            exit 1
          fi
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/api/health >/tmp/smileup-status.json; then
              break
            fi
            if [ "$attempt" = "30" ]; then
              systemctl --no-pager --full status "$SERVICE_NAME" || true
              journalctl -u "$SERVICE_NAME" --no-pager -n 80 || true
              rollback
              exit 1
            fi
            sleep 1
          done
          cat /tmp/smileup-status.json

          rm -rf "$BACKUP"
          REMOTE_DEPLOY

      - name: Deployment skipped
        if: env.DEPLOY_ENABLED != 'true'
        run: |
          echo "Regression checks passed. Add SERVER_HOST, SERVER_USER, and SERVER_PASSWORD repository secrets to enable automatic deployment."
