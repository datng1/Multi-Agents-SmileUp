name: Deploy SmileUp CMO

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: smileup-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to production server
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build release archive
        run: |
          set -euo pipefail
          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='.venv' \
            --exclude='venv' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='*.log' \
            --exclude='data' \
            --exclude='reports' \
            --exclude='web/generated' \
            -czf smileup-release.tar.gz .

      - name: Upload release archive
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: smileup-release.tar.gz
          target: /tmp
          overwrite: true

      - name: Deploy and restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 15m
          script: |
            set -euo pipefail

            APP_DIR="/opt/smileup-multi-agents"
            SERVICE_NAME="smileup-cmo"
            RELEASE="/tmp/smileup-release.tar.gz"
            STAGE="/tmp/smileup-release"
            PRESERVE="/tmp/smileup-preserve"

            if [ ! -f "$RELEASE" ]; then
              echo "Release archive not found: $RELEASE"
              exit 1
            fi

            rm -rf "$STAGE" "$PRESERVE"
            mkdir -p "$STAGE" "$PRESERVE"
            tar -xzf "$RELEASE" -C "$STAGE"

            if [ -d "$APP_DIR" ]; then
              [ -f "$APP_DIR/.env" ] && cp -a "$APP_DIR/.env" "$PRESERVE/.env"
              [ -d "$APP_DIR/data" ] && cp -a "$APP_DIR/data" "$PRESERVE/data"
              [ -d "$APP_DIR/reports" ] && cp -a "$APP_DIR/reports" "$PRESERVE/reports"
              [ -d "$APP_DIR/web/generated" ] && mkdir -p "$PRESERVE/web" && cp -a "$APP_DIR/web/generated" "$PRESERVE/web/generated"
            fi

            systemctl stop "$SERVICE_NAME" 2>/dev/null || true
            rm -rf "$APP_DIR"
            mkdir -p "$APP_DIR"
            cp -a "$STAGE/." "$APP_DIR/"

            [ -f "$PRESERVE/.env" ] && cp -a "$PRESERVE/.env" "$APP_DIR/.env"
            mkdir -p "$APP_DIR/data" "$APP_DIR/reports" "$APP_DIR/web/generated/uploads" "$APP_DIR/web/generated/creatives"
            [ -d "$PRESERVE/data" ] && cp -a "$PRESERVE/data/." "$APP_DIR/data/"
            [ -d "$PRESERVE/reports" ] && cp -a "$PRESERVE/reports/." "$APP_DIR/reports/"
            [ -d "$PRESERVE/web/generated" ] && cp -a "$PRESERVE/web/generated/." "$APP_DIR/web/generated/"

            cd "$APP_DIR"
            python3 -m venv .venv
            .venv/bin/python -m pip install --upgrade pip
            .venv/bin/pip install -r requirements.txt

            systemctl daemon-reload
            systemctl restart "$SERVICE_NAME"
            systemctl is-active --quiet "$SERVICE_NAME"
            curl -fsS http://127.0.0.1:8765/api/status >/tmp/smileup-status.json
            cat /tmp/smileup-status.json

            rm -rf "$STAGE" "$PRESERVE" "$RELEASE" /tmp/smileup-status.json
